<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глосс Скряга — AgentPong</title>
<link rel="icon" href="../Asset/agent/icon.png">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="stage">
    <!-- Агент: idle-дыхание на CSS, эмоции подменяют картинку -->
    <div id="agent-slot">
        <img id="agent" src="../Asset/agent/agent-01-idle.webp" alt="Глосс Скряга">
        <div id="agent-caption">Глосс Скряга</div>
    </div>

    <!-- Диалоговая колонка -->
    <div id="talk">
        <!-- окно агента: газетный фон + текст -->
        <div class="dialog" id="dlg-agent">
            <img class="dialog-bg" src="../Asset/ui/dialog-01.webp" alt="">
            <div class="dialog-text" id="agent-text">Ба-а... клиент. И даже бесплатный. Заходи, чего уж.</div>
        </div>

        <!-- лог последних реплик -->
        <div id="log"></div>

        <!-- ввод -->
        <div id="input-row">
            <input id="say" type="text" autocomplete="off"
                   placeholder="скажи Скряге что-нибудь…">
            <button id="mic" title="голосовой ввод (ru-RU)">🎤</button>
            <button id="send" title="отправить">➤</button>
        </div>

        <!-- трамвайные пути: голос и мозг -->
        <div id="switches">
            <label>Голос:
                <select id="voice-engine">
                    <option value="piper">Piper (dmitri, ~60 МБ разово)</option>
                    <option value="webspeech">Встроенный (0 МБ)</option>
                    <option value="off">Тихий</option>
                </select>
            </label>
            <label>Мозг:
                <select id="brain-engine">
                    <option value="rules">Оффлайн-скряга (правила)</option>
                    <option value="llm-api">LLM API (нужен ключ)</option>
                </select>
            </label>
            <span id="engine-status"></span>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
