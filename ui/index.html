<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Агент Понг</title>
<link rel="icon" href="../Asset/agent/icon.png">
<link rel="apple-touch-icon" href="../Asset/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141b24">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="stage">
    <!-- Агент: idle-дыхание на CSS, эмоции подменяют картинку -->
    <div id="agent-slot">
        <div id="agent-frame">
            <img id="agent" src="../Asset/agent/frames/happy-1.png" alt="Агент Понг">
            <img id="agent-b" aria-hidden="true" alt="">
        </div>
        <div id="agent-caption">Агент Понг</div>
    </div>

    <!-- Диалоговая колонка: его газета и твоя газета -->
    <div id="talk">
        <!-- ЕГО газета: реплика агента -->
        <div class="dialog" id="dlg-agent">
            <img class="dialog-bg" src="../Asset/ui/dialog-01.webp" alt="">
            <div class="dialog-text" id="agent-text">Ба-а... клиент. И даже бесплатный. Заходи, чего уж.</div>
            <!-- трамвайные пути: шестерёнка + всплывающая панель -->
            <div id="toolbar">
                <button id="gear" title="голос и мозг">⚙</button>
            </div>
            <div id="switches" hidden>
                <div id="switches-head">
                    <span>Настройки</span>
                    <button id="switches-close" title="закрыть">✕</button>
                </div>
                <label>Голос:
                    <select id="voice-engine">
                        <option value="piper">Piper (dmitri)</option>
                        <option value="win">Системный Windows (0 МБ)</option>
                        <option value="webspeech">Браузерный встроенный</option>
                        <option value="off">Тихий</option>
                    </select>
                    <button id="voice-test" title="проба голоса">♪</button>
                </label>
                <label>Мозг:
                    <select id="brain-engine">
                        <option value="rules">Оффлайн-скряга (правила)</option>
                        <option value="web-llm">Локальный мозг (без ключей, разовая закачка)</option>
                        <option value="llm-api">Облако (Grok / OpenRouter / свой URL)</option>
                    </select>
                </label>
                <label class="key-row" id="win-voices-row" hidden>Голос Windows (SAPI):
                    <select id="win-voice"></select>
                </label>
                <label class="key-row">Локальная модель:
                    <select id="llm-model"></select>
                </label>
                <span class="hint">модель качается сама при смене (сотни МБ из интернета,
                    дальше оффлайн); работает, когда мозг = «Локальный»</span>
                <span id="hw-line" class="hint" hidden></span>
                <button id="rhvoice" title="открыть страницу релизов RHVoice"
                        class="rhvoice-hint" hidden>RHVoice не найден — скачать живые бесплатные голоса ↗</button>
                <label class="key-row" id="cloud-row" hidden>Поставщик облака:
                    <select id="cloud-provider">
                        <option value="zai">GLM (Z.ai) — без VPN, email</option>
                        <option value="qwen">Qwen (Alibaba, без VPN)</option>
                        <option value="deepseek">DeepSeek (без VPN, платный)</option>
                        <option value="glm">BigModel (упирается в +86)</option>
                        <option value="grok">Grok (нужен VPN)</option>
                        <option value="openrouter">OpenRouter (нужен VPN)</option>
                        <option value="custom">Свой URL</option>
                    </select>
                </label>
                <label class="key-row" id="cloud-url-row" hidden>URL:
                    <input id="cloud-url" type="text" placeholder="https://…/v1">
                </label>
                <label class="key-row" id="cloud-model-row" hidden>Модель:
                    <input id="cloud-model" type="text" placeholder="grok-3-mini">
                </label>
                <label class="key-row" id="cloud-key-row" hidden>Ключ облака:
                    <input id="cloud-key" type="password" placeholder="ключ xai-… / sk-…">
                    <button id="cloud-save" title="сохранить ключ">✓</button>
                    <button id="cloud-ping" title="проверить ключ">⚡</button>
                </label>
                <span id="cloud-status" class="hint" hidden></span>
                <span id="engine-status"></span>
                <button id="perms-reset" class="key-row" title="все скилы снова спрашивают">Сбросить разрешения скилов</button>
            </div>
        </div>

        <!-- ТВОЯ газета: последняя реплика + строка ввода -->
        <div class="dialog" id="dlg-user">
            <img class="dialog-bg" src="../Asset/ui/dialog-02.webp" alt="">
            <div class="dialog-text user" id="user-text"></div>
            <div id="input-row">
                <input id="say" type="text" autocomplete="off"
                       placeholder="скажи Понгу…">
                <button id="mic" title="говорить (ru-RU)">🎤</button>
                <button id="send" title="отправить">➤</button>
            </div>
        </div>

        <!-- реплики прошлые — разматываются по клику -->
        <button id="log-toggle" title="прошлые реплики">свиток разговоров ▾</button>
        <div id="log" hidden></div>

        <!-- турникет скилов: спросить / всегда / никогда -->
        <div id="perm-gate" hidden>
            <div id="perm-text"></div>
            <div id="perm-btns">
                <button id="perm-always" title="больше не спрашивать">всегда</button>
                <button id="perm-once" title="только сейчас">сейчас</button>
                <button id="perm-never" title="не разрешать">нет</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
<script>
    // PWA: регистрация service worker
    if ('serviceWorker' in navigator) {
        addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
</script>
</body>
</html>
